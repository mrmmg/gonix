# gonix configuration.
#
# This file is installed to /etc/gonix/gonix.yaml by `make install` (build
# from source) and by install.sh / GitHub Releases (prebuilt install), and is
# never overwritten once present. All paths used by gonix are centralized
# here; nothing is hard-coded in the application itself.

nginx:
  config_dir: /etc/nginx
  sites_available: /etc/nginx/sites-available
  sites_enabled: /etc/nginx/sites-enabled
  binary_path: nginx
  # Passed to `nginx -t -c`; empty uses the binary's built-in default.
  config_file: ""
  # systemd unit reloaded after every change.
  service: nginx
  # http-level files generated by GoNix (real client IP, rate limit zones,
  # maintenance bypass, ...) are written here. nginx.conf must include this
  # directory inside its http block, e.g. `include /etc/nginx/conf.d/*.conf;`
  # (the default on Debian/Ubuntu/RHEL).
  http_snippets_dir: /etc/nginx/conf.d
  # Responses cached by the "Proxy cache" host preset are stored here.
  cache_dir: /var/cache/nginx/gonix
  # TCP/UDP stream proxies are written here and included from a stream { }
  # block. When nginx.conf has no stream block yet, GoNix can create one in
  # main_include_dir, a directory nginx.conf includes at top level (Debian
  # and Ubuntu: /etc/nginx/modules-enabled).
  streams_dir: /etc/nginx/gonix-streams
  main_include_dir: /etc/nginx/modules-enabled
  # Ports new hosts listen on. Plain HTTP is redirected to HTTPS with the
  # port included when it is not 443.
  http_port: 80
  https_port: 443

certificates:
  # Centralized certificate directory. Certificates are obtained manually
  # (e.g. via certbot with a DNS challenge) and placed here as:
  #   <directory>/<domain>/fullchain.pem
  #   <directory>/<domain>/privkey.pem
  directory: /etc/nginx/certs

logs:
  nginx_directory: /var/log/nginx
  audit_file: /var/log/gonix/audit.log

backup:
  directory: /etc/gonix/backups
  keep_count: 20

access_lists:
  directory: /etc/gonix/accesslists
  # Group that owns the htpasswd files, so Nginx worker processes can read
  # them. Leave empty to detect it from nginx.conf's `user` directive or
  # `nginx -V` (e.g. www-data on Debian/Ubuntu, http on Arch, nginx on RHEL).
  group: ""

error_pages:
  # Generated error page snippets (gonix-error-pages-<name>.conf) are
  # written here and included by hosts that use them.
  snippets_directory: /etc/nginx/snippets
  # Default directory holding the HTML pages, named <code>.html (e.g.
  # 502.html). Each snippet stores its own directory; this is only the
  # default offered when creating one.
  pages_directory: /var/www/html/error_pages

geoip:
  # MaxMind GeoLite2/GeoIP2 Country database used by country blocking. It
  # needs the third-party geoip2 Nginx module (Debian/Ubuntu:
  # libnginx-mod-http-geoip2) and a database, e.g. from geoipupdate.
  database: /usr/share/GeoIP/GeoLite2-Country.mmdb

history:
  # Commit the Nginx configuration to a Git repository after every
  # successful change, so any earlier state can be inspected and restored
  # from "Configuration History". Requires git; the repository is kept
  # outside /etc/nginx.
  enabled: true
  git_dir: /etc/gonix/history.git
