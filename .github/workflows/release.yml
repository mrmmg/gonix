name: Release

# Builds GoNix and publishes a GitHub Release whenever a version tag
# (v1.0.0, v1.2.3, ...) is pushed. The tag is the single source of truth
# for the release version; nothing here is hand-triggered or manual.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build:
    name: Build (linux/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Exclude art/ and docs/ from build context
        run: rm -rf art docs

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Determine release version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build gonix-linux-${{ matrix.goarch }}
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X github.com/mrmmg/gonix/internal/tui.Version=${{ steps.version.outputs.version }}" \
            -o "dist/gonix-linux-${{ matrix.goarch }}" \
            ./cmd/gonix

      - name: Checksum
        working-directory: dist
        run: sha256sum "gonix-linux-${{ matrix.goarch }}" > "gonix-linux-${{ matrix.goarch }}.sha256"

      - name: Smoke-test binary
        if: matrix.goarch == 'amd64'
        run: dist/gonix-linux-amd64 --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gonix-linux-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # git-cliff needs the full history and tags to find the previous release.
          fetch-depth: 0

      - name: Exclude art/ and docs/ from build context
        run: rm -rf art docs

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Assemble release assets
        working-directory: dist
        run: |
          cat ./*.sha256 > checksums.txt
          cp "$GITHUB_WORKSPACE/configs/default.yaml" gonix.yaml
          ls -la

      - name: Create release
        uses: softprops/action-gh-release@v2.0.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: GoNix ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            dist/gonix-linux-amd64
            dist/gonix-linux-arm64
            dist/checksums.txt
            dist/gonix.yaml

  changelog:
    name: Update CHANGELOG.md on main
    needs: release
    runs-on: ubuntu-latest
    concurrency:
      group: changelog
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit CHANGELOG.md to main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cp CHANGELOG.md "$RUNNER_TEMP/CHANGELOG.md"
          git fetch origin main

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$TAG is not on main; leaving CHANGELOG.md alone."
            exit 0
          fi

          git checkout -f -B main origin/main
          cp "$RUNNER_TEMP/CHANGELOG.md" CHANGELOG.md
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md is already up to date."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): update changelog for ${TAG} [skip ci]"
          git push origin main
